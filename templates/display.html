<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Trainspotter departure display">
    <title>Trainspotter Display</title>
    <!-- styles.css provides .line-* badge colours reused by display.js -->
    <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
    <link rel="stylesheet" href="/static/display.css?v={{ asset_version }}">
</head>
<body>
    <div class="display-wrapper">
        <header class="display-header">
            <span class="station-title" id="station-title" aria-label="Station name">—</span>
            <div class="schedule-badges" id="schedule-badges" aria-label="Scheduled reminders"></div>
            <div class="header-right">
                <button type="button" class="stale-badge" id="stale-badge"
                        aria-live="polite" aria-label="Fetch status — tap for details">
                    ⚠&thinsp;stale data
                </button>
                <time class="header-time" id="header-time" aria-label="Current time"></time>
                <span class="last-updated-ago" id="last-updated-ago" aria-live="polite"></span>
                <button id="schedule-btn" class="icon-button" aria-label="Schedule train reminder" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
                <button id="mute-btn" class="icon-button" aria-label="Mute alarm" aria-pressed="false">
                    <!-- speaker.wave.2 — shown when unmuted -->
                    <svg class="icon-sound-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M18.36 5.64a9 9 0 0 1 0 12.72"/>
                    </svg>
                    <!-- speaker.slash — shown when muted -->
                    <svg class="icon-sound-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M11 5 6 9H3v6h3l5 4V5z"/>
                        <line x1="23" y1="9" x2="17" y2="15"/>
                        <line x1="17" y1="9" x2="23" y2="15"/>
                    </svg>
                </button>
                <a href="/" class="display-nav-link" aria-label="Open dashboard">☰</a>
            </div>
        </header>

        <main class="display-grid" id="display-grid" aria-label="Departure board">
            <div class="quadrant quadrant--loading" aria-busy="true">
                <div class="loading-pulse"></div>
            </div>
            <div class="quadrant quadrant--loading" aria-busy="true">
                <div class="loading-pulse"></div>
            </div>
            <div class="quadrant quadrant--loading" aria-busy="true">
                <div class="loading-pulse"></div>
            </div>
            <div class="quadrant quadrant--loading" aria-busy="true">
                <div class="loading-pulse"></div>
            </div>
        </main>
    </div>

    <!-- Zoom modal — shown when a departure badge is tapped -->
    <div class="modal-overlay" id="modal-overlay" hidden
         role="dialog" aria-modal="true" aria-label="Departure detail">
        <div class="modal-card" id="modal-card">
            <div class="modal-minutes" id="modal-minutes" aria-live="polite">--</div>
            <div class="modal-chip-row">
                <span class="modal-arrow" id="modal-arrow" aria-hidden="true"></span>
                <span class="line-badge modal-line-chip" id="modal-line-chip"></span>
            </div>
            <time class="modal-clock" id="modal-clock"></time>
            <p class="modal-vbb-warning" id="modal-vbb-warning" hidden aria-live="polite">
                ⚠ VBB API is down — predicted times may be inaccurate. Please double-check departure times.
            </p>
        </div>
    </div>

    <!-- Schedule modal — shown when + button is tapped -->
    <div class="modal-overlay schedule-overlay" id="schedule-overlay" hidden
         role="dialog" aria-modal="true" aria-labelledby="schedule-modal-title">
        <div class="modal-card modal-card--schedule" id="schedule-modal-card">
            <h2 class="schedule-modal-title" id="schedule-modal-title">Schedule Reminder</h2>

            <!-- Time picker — two scroll-snap wheels -->
            <div class="schedule-time-picker">
                <div class="schedule-wheel-wrap">
                    <div class="schedule-wheel" id="schedule-wheel-hour" role="listbox" aria-label="Hour"></div>
                </div>
                <span class="schedule-time-colon" aria-hidden="true">:</span>
                <div class="schedule-wheel-wrap">
                    <div class="schedule-wheel" id="schedule-wheel-minute" role="listbox" aria-label="Minute"></div>
                </div>
            </div>

            <p class="schedule-date-hint" id="schedule-date-hint" aria-live="polite"></p>

            <!-- Repeat day picker — populated by JS -->
            <div class="schedule-repeat-section">
                <p class="schedule-section-label">Repeat</p>
                <div class="schedule-day-grid" id="schedule-day-grid"
                     role="group" aria-label="Repeat on days of week"></div>
            </div>

            <!-- Quadrant picker — 4 buttons populated by JS from live data -->
            <div class="schedule-quadrant-grid" id="schedule-quadrant-grid"
                 role="group" aria-label="Direction"></div>

            <!-- Actions -->
            <div class="schedule-modal-actions">
                <button type="button" id="schedule-cancel-btn"
                        class="schedule-action-btn schedule-action-btn--cancel">Cancel</button>
                <button type="button" id="schedule-save-btn"
                        class="schedule-action-btn schedule-action-btn--save" disabled>Save</button>
            </div>
        </div>
    </div>

    <!-- Diagnostics modal — shown when stale/error badge is tapped -->
    <div class="modal-overlay diagnostics-overlay" id="diagnostics-overlay" hidden
         role="dialog" aria-modal="true" aria-labelledby="diagnostics-modal-title">
        <div class="modal-card modal-card--diagnostics" id="diagnostics-modal-card">
            <h2 class="schedule-modal-title" id="diagnostics-modal-title">Diagnostics</h2>
            <dl class="diagnostics-body" id="diagnostics-body"></dl>
            <div class="schedule-modal-actions schedule-modal-actions--end">
                <button type="button" id="diagnostics-close-btn"
                        class="schedule-action-btn schedule-action-btn--save">Close</button>
            </div>
        </div>
    </div>

    <script src="/static/display.js?v={{ asset_version }}"></script>
</body>
</html>
